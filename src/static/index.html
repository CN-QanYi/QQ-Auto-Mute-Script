<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ 自动禁言 - 配置面板</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <h1>🔇 QQ 自动禁言配置面板</h1>
        <div class="header-controls">
            <button class="sync-btn" id="syncControl" type="button" aria-label="切换自动刷新">
                <svg class="sync-icon" id="syncIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                    <path d="M21 3v5h-5"></path>
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                    <path d="M8 16H3v5"></path>
                </svg>
                <span class="sync-label" id="syncLabel">自动刷新</span>
            </button>
            <div class="header-status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">连接中...</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar - Group List -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-header-left">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    群聊列表
                </div>
                <button class="sidebar-add-btn" id="addGroupBtn" type="button" title="通过群号创建配置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            <div class="group-list" id="groupList">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
            <div class="sidebar-actions">
                <button class="btn btn-secondary sidebar-btn" onclick="openBatchExportModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    批量导出
                </button>
                <button class="btn btn-secondary sidebar-btn" onclick="importConfig()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    导入配置
                </button>
            </div>
            <input type="file" id="configFileInput" accept=".json" style="display: none;">
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent" style="display: none;">
            <!-- Member Selection Card -->
            <div class="card">
                <div class="card-header">
                    <h3>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="23" y1="11" x2="17" y2="11"></line>
                        </svg>
                        监控名单
                    </h3>
                    <span style="color: var(--text-secondary);">
                        已选择 <strong id="selectedCount" style="color: var(--accent-color);">0</strong> 人
                    </span>
                </div>
                <div class="card-body">
                    <div class="member-search">
                        <div class="search-wrapper">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input type="text" class="search-input" id="memberSearch" placeholder="搜索成员（昵称/QQ号）...">
                        </div>
                    </div>
                    <!-- 离线添加成员控件 -->
                    <div class="offline-member-add" id="offlineMemberAdd" style="display:none;">
                        <input type="text" id="offlineQQInput" class="search-input"
                            placeholder="输入 QQ 号 (5-12位数字)" maxlength="12"
                            oninput="validateOfflineQQ(this)"
                            onkeydown="if(event.key === 'Enter') addOfflineMember()">
                        <span class="input-error" id="offlineQQError"></span>
                        <button class="btn btn-primary btn-sm" onclick="addOfflineMember()">添加</button>
                    </div>
                    <div class="member-grid" id="memberGrid">
                        <div class="loading">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Config Card -->
            <div class="card">
                <div class="card-header">
                    <h3>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                            </path>
                        </svg>
                        禁言设置
                    </h3>
                </div>
                <div class="card-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="threshold">触发阈值（第几条消息开始禁言）</label>
                            <input type="number" id="threshold" value="5" min="1" max="100">
                        </div>
                        <div class="form-group">
                            <label for="comboTimeout">连击超时（秒）</label>
                            <input type="number" id="comboTimeout" value="180" min="30" max="3600">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Scheduled Mute Card -->
            <div class="card">
                <div class="card-header">
                    <h3>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        定时禁言
                    </h3>
                    <div class="toggle-wrapper">
                        <span style="color: var(--text-secondary); font-size: 0.85rem;">启用</span>
                        <div class="toggle" id="scheduledMuteToggle" tabindex="0" role="switch" aria-checked="false"
                            onclick="toggleScheduledMute()"
                            onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggleScheduledMute(); }">
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="form-grid" style="margin-bottom: 20px;">
                        <div class="form-group">
                            <label for="cooldown">冷却时间（秒）</label>
                            <input type="number" id="cooldown" value="30" min="5" max="300">
                        </div>
                    </div>

                    <div class="time-ranges">
                        <label
                            style="display: block; margin-bottom: 12px; color: var(--text-secondary); font-size: 0.85rem;">
                            时间段设置（可按星期单独配置）
                        </label>
                        <div class="day-tabs" id="dayTabs"></div>
                        <div class="time-range-list" id="timeRangeList"></div>
                        <button class="btn-add" onclick="addTimeRange()">+ 添加时间段</button>
                    </div>

                    <!-- Action Buttons -->
                    <div class="actions">
                        <button class="btn btn-danger" onclick="deleteConfig()">删除配置</button>
                        <button class="btn btn-primary" onclick="saveConfig()">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                                <polyline points="7 3 7 8 15 8"></polyline>
                            </svg>
                            保存配置
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Empty State -->
        <div class="main-content" id="emptyContent">
            <div class="card">
                <div class="empty-state" style="padding: 80px 40px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M15 10l-4 4l6 6l4-16l-18 7l4 2l2 6l3-4"></path>
                    </svg>
                    <h3>选择一个群聊开始配置</h3>
                    <p>从左侧列表中选择要配置的群聊</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Batch Export Modal -->
    <div class="modal-overlay" id="batchExportModal" style="display: none;"
        onclick="if(event.target===this)closeBatchExportModal()">
        <div class="modal">
            <div class="modal-header">
                <h3>批量导出配置</h3>
                <button class="modal-close" onclick="closeBatchExportModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-hint">选择要导出的群配置：</div>
                <div class="export-group-list" id="exportGroupList"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="toggleAllExportGroups()">全选 / 反选</button>
                <button class="btn btn-primary" onclick="executeBatchExport()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    导出选中
                </button>
            </div>
        </div>
    </div>

    <!-- Import Preview Modal -->
    <div class="modal-overlay" id="importPreviewModal" style="display: none;"
        onclick="if(event.target===this)closeImportPreviewModal()">
        <div class="modal import-preview-modal">
            <div class="modal-header">
                <h3>📥 导入配置预览</h3>
                <button class="modal-close" onclick="closeImportPreviewModal()">&times;</button>
            </div>

            <!-- Progress Bar -->
            <div class="import-progress-bar" id="importProgressBar" style="display: none;">
                <div class="import-progress-fill" id="importProgressFill"></div>
            </div>

            <div class="modal-body">
                <!-- Stats Summary -->
                <div class="import-stats" id="importStats"></div>

                <!-- Validation Errors -->
                <div class="import-section" id="importValidationErrors" style="display: none;">
                    <h4 class="import-section-title">⚠️ 验证错误</h4>
                    <div class="import-section-content" id="validationErrorList"></div>
                </div>

                <!-- Match Results -->
                <div class="import-section" id="importMatchResults">
                    <h4 class="import-section-title">🔗 群聊匹配结果</h4>
                    <div class="import-section-content" id="matchResultList"></div>
                </div>

                <!-- Conflicts -->
                <div class="import-section" id="importConflicts" style="display: none;">
                    <h4 class="import-section-title">⚡ 配置冲突</h4>
                    <div class="import-section-content" id="conflictList"></div>
                </div>
            </div>

            <div class="modal-footer">
                <div class="import-mode-select">
                    <label for="importModeSelect">导入模式：</label>
                    <select id="importModeSelect">
                        <option value="merge">合并（推荐）</option>
                        <option value="overwrite">覆盖</option>
                    </select>
                </div>
                <div class="import-footer-actions">
                    <button class="btn btn-secondary" onclick="closeImportPreviewModal()">取消</button>
                    <button class="btn btn-primary" id="confirmImportBtn" onclick="executeImport()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        确认导入
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/app.js"></script>
</body>

</html>
